[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artil"
version = "0.0.0"
description = "Reproducible lab for measuring prompt-injection attacks and defenses on tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
artil = "artil.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/artil"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
